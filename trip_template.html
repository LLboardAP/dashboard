<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トリップ検索</title>
<meta name="description" content="指定した期間のユニークトリップ数・新規スレッド数の確認と、トリップ別の投稿本文の検索。">
<meta name="robots" content="index,follow">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --border: rgba(11,11,11,.10);
  --s1: #2a78d6;
  --s2: #eb6834;
  --up: #006300;
  --hover: rgba(11,11,11,.06);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --up: #0ca30c;
    --hover: rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: rgba(255,255,255,.10);
  --s1: #3987e5; --s2: #d95926; --up: #0ca30c;
  --hover: rgba(255,255,255,.08);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.sub { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.range-badge {
  display: inline-block; font-size: 15px; font-weight: 700; color: var(--ink);
  background: var(--hover); border: 1px solid var(--border); border-radius: 8px;
  padding: 3px 12px; margin-top: 2px;
}
button { font: inherit; color: inherit; }
a { color: var(--s1); }
.iconbtn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; color: var(--ink2); white-space: nowrap;
  text-decoration: none; display: inline-block;
}
.iconbtn:hover { background: var(--hover); }
.hright { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 12px; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--hover); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 650; background: var(--hover); }
.seg button[aria-pressed="true"]::before { content: "✓ "; }
.range { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
input[type="date"], input[type="search"] {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px;
}
input[type="search"] { padding: 5px 10px; min-width: 200px; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

.kpis { display: grid; gap: 12px; margin-bottom: 16px; grid-template-columns: repeat(2, 1fr); }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-label { color: var(--ink2); font-size: 13px; }
.t-value { font-size: 32px; font-weight: 650; line-height: 1.2; letter-spacing: -.01em; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; margin-bottom: 16px; }
details summary { cursor: pointer; font-weight: 650; font-size: 15px; }
.cap { color: var(--ink2); font-size: 12px; margin: 2px 0 8px; }
.rank-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.chk-filter { display: flex; align-items: center; gap: 4px; cursor: pointer; margin-top: 0; }
.chk-rank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.chk-rank-h { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--ink2); }
.chk-rank-empty { color: var(--muted); font-size: 13px; padding: 8px 2px; }
.tablewrap { max-height: 420px; overflow: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface); color: var(--ink2); font-weight: 600; }
#rank-table tbody tr { cursor: pointer; }
#rank-table tbody tr:hover, #rank-table tbody tr.sel { background: var(--hover); }
#rank-table tbody tr.chk-row { background: color-mix(in srgb, var(--s2) 12%, var(--surface)); }
#rank-table tbody tr.chk-row:hover, #rank-table tbody tr.chk-row.sel { background: color-mix(in srgb, var(--s2) 22%, var(--surface)); }
#rank-table td.l, #rank-table th.l { text-align: left; }
#rank-table td.trip { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
#rank-table th button.th-sort { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
#rank-table th button.th-sort:hover { color: var(--ink); }
.chk-cell { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.chk-count { font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; color: var(--ink2); }
.chk-btn { font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
.chk-btn:hover { background: var(--hover); }
.chk-btn.done { background: var(--s2); border-color: var(--s2); color: #fff; }
.chk-btn.done:hover { opacity: .85; }
.rank-more { margin-top: 10px; }

.detail { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.detail-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 6px; }
.detail-h b { font-family: ui-monospace, Consolas, monospace; font-size: 16px; }
.detail-h .sub { margin: 0; }
.detail-h .iconbtn { margin-left: auto; padding: 2px 10px; }
.detail-h .iconbtn + .iconbtn { margin-left: 0; }
.share-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; }
#rd-share-url { flex: 1 1 320px; min-width: 0; font: inherit; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
#rd-share-msg { color: var(--up); }

.rd-posts summary { cursor: pointer; }
.rd-post { border-bottom: 1px solid var(--border); padding: 8px 0; }
.rd-post:last-child { border-bottom: none; }
.rd-post-thread { display: inline-block; font-size: 13px; font-weight: 650; margin-bottom: 2px; }
a.rd-post-thread { color: var(--s1); text-decoration: none; }
a.rd-post-thread:hover { text-decoration: underline; }
.rd-post-head { font-size: 12px; color: var(--ink2); margin-bottom: 4px; font-family: ui-monospace, Consolas, monospace; }
.rd-post-body { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.6; }

.notes { color: var(--ink2); font-size: 12px; margin-top: 20px; }
.notes li { margin: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>トリップ検索</h1>
      <div class="range-badge" id="period"></div>
    </div>
    <div class="hright">
      <button class="iconbtn" id="theme" type="button" aria-label="表示テーマを切り替え">◐ テーマ</button>
    </div>
  </header>

  <div class="filters" role="group" aria-label="集計期間">
    <div class="seg" id="presets"></div>
    <div class="range">
      <input type="date" id="from" aria-label="開始日"> – <input type="date" id="to" aria-label="終了日">
    </div>
    <button class="iconbtn" id="day-prev" type="button">◀ 前日</button>
    <button class="iconbtn" id="day-next" type="button">翌日 ▶</button>
  </div>
  <div class="filters" role="group" aria-label="日付を指定して見る">
    <label class="sub" for="daypick">日付で指定</label>
    <input type="date" id="daypick" aria-label="表示する日付">
  </div>

  <section class="kpis" id="kpis" aria-label="主要指標">
    <div class="tile">
      <div class="t-label" id="k1-label">ユニークトリップ数</div>
      <div class="t-value" id="k1-value">–</div>
    </div>
    <div class="tile">
      <div class="t-label" id="k2-label">新規スレッド数</div>
      <div class="t-value" id="k2-value">–</div>
    </div>
  </section>

  <details class="card" id="chk-rank-card" open>
    <summary>チェック数ランキング(最終登場日別)</summary>
    <div class="cap">最終登場日が「本日」「直近7日以内」「直近30日以内」のトリップを、チェック数が多い順に表示します</div>
    <div class="chk-rank-grid">
      <div class="chk-rank-col">
        <h3 class="chk-rank-h">本日</h3>
        <div class="tablewrap"><table id="chk-rank-today"><thead></thead><tbody></tbody></table></div>
      </div>
      <div class="chk-rank-col">
        <h3 class="chk-rank-h">直近7日以内</h3>
        <div class="tablewrap"><table id="chk-rank-7d"><thead></thead><tbody></tbody></table></div>
      </div>
      <div class="chk-rank-col">
        <h3 class="chk-rank-h">直近30日以内</h3>
        <div class="tablewrap"><table id="chk-rank-30d"><thead></thead><tbody></tbody></table></div>
      </div>
    </div>
  </details>

  <details class="card" id="search-card" open>
    <summary>トリップを探す</summary>
    <div class="cap">上で指定した期間内の投稿数順です。一覧から選ぶか、検索欄にトリップ文字列を入力して Enter で直接選べます</div>
    <div class="rank-tools">
      <input type="search" id="rank-q" placeholder="トリップで検索(部分一致 / Enterで直接選択)" aria-label="トリップで検索">
      <label class="sub chk-filter"><input type="checkbox" id="rank-chk-only">チェックしたトリップだけ表示</label>
      <span class="sub" id="rank-count"></span>
    </div>
    <div class="tablewrap"><table id="rank-table"><thead></thead><tbody></tbody></table></div>
    <button class="iconbtn rank-more" id="rank-more" type="button"></button>
  </details>

  <div class="detail" id="rank-detail" hidden>
    <div class="detail-h">
      <b id="rd-name"></b><span class="sub" id="rd-meta"></span>
      <button class="iconbtn" id="rd-share" type="button">共有URLをコピー</button>
      <button class="iconbtn" id="rd-close" type="button">閉じる</button>
    </div>
    <div class="share-row" id="rd-share-row" hidden>
      <input type="text" id="rd-share-url" readonly aria-label="このトリップの共有URL">
      <span class="sub" id="rd-share-msg"></span>
    </div>
    <div class="range-badge" id="pd-period" style="margin-bottom:6px"></div>
    <div class="filters" style="margin:2px 0 10px" role="group" aria-label="このトリップの対象範囲">
      <label class="sub" style="margin:0">対象範囲</label>
      <div class="seg" id="pd-presets"></div>
      <div class="range">
        <input type="date" id="pd-from" aria-label="対象範囲の開始日"> – <input type="date" id="pd-to" aria-label="対象範囲の終了日">
      </div>
      <button class="iconbtn" id="pd-prev" type="button">◀ 前日</button>
      <button class="iconbtn" id="pd-next" type="button">翌日 ▶</button>
    </div>
    <details class="card rd-posts" id="rd-posts-card" open style="margin-bottom:0">
      <summary>このトリップのレス</summary>
      <div class="cap" style="margin-top:6px">上の「対象範囲」内の投稿本文です(保持期間より前の投稿は表示されません)</div>
      <div class="rank-tools">
        <input type="search" id="rd-posts-q" placeholder="投稿内容で絞り込み" aria-label="投稿内容で絞り込み">
        <span class="sub" id="rd-posts-count"></span>
      </div>
      <div id="rd-posts-list"></div>
      <button class="iconbtn rank-more" id="rd-posts-more" type="button"></button>
    </details>
  </div>

  <ul class="notes" id="notes"></ul>
</div>

<script>
const D = /*__DATA__*/null;
(function () {
const $ = s => document.querySelector(s);
function h(tag, cls, text, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const fmt0 = n => Math.round(n).toLocaleString('ja-JP');
const fmtDate = s => { const [y, m, d] = s.split('-'); return `${y}/${+m}/${+d}`; };
const fmtStamp = s => { const [d, ...rest] = s.split(' '); return [fmtDate(d), ...rest].join(' '); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- トリップの「チェック」機能(人気の目安。Firebase Realtime Databaseにカウントのみ保存) ---------- */
const FB_DB_URL = 'https://shitaraba-dashboard-default-rtdb.firebaseio.com';
const CHECK_KEY = 'checkedTrips';
let CHECKS = {};
function myChecked() {
  try { return new Set(JSON.parse(localStorage.getItem(CHECK_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveChecked(set) {
  try { localStorage.setItem(CHECK_KEY, JSON.stringify([...set])); } catch { /* 無視(プライベートモード等) */ }
}
async function loadChecks() {
  try {
    const res = await fetch(`${FB_DB_URL}/checks.json`);
    CHECKS = (await res.json()) || {};
  } catch { CHECKS = {}; }
}
// チェック/解除を切り替える(1ブラウザにつき1トリップ1票。厳密な不正対策ではなく連打を防ぐ程度)
async function toggleCheck(trip, onDone) {
  const done = myChecked();
  const nowChecked = done.has(trip);
  const delta = nowChecked ? -1 : 1;
  if (nowChecked) done.delete(trip); else done.add(trip);
  saveChecked(done);
  CHECKS[trip] = Math.max(0, (CHECKS[trip] || 0) + delta);
  onDone && onDone();
  try {
    await fetch(`${FB_DB_URL}/checks.json`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [trip]: { '.sv': { increment: delta } } }),
    });
  } catch { /* 通信に失敗しても見た目はそのまま。次回読み込みで実際の値に揃う */ }
}

const N = D.dates.length;
const nTrips = D.meta.trips;
const firstSeen = new Int32Array(nTrips).fill(-1);
const lastSeen = new Int32Array(nTrips).fill(-1);
for (let i = 0; i < N; i++) {
  const p = D.tripDays[i];
  for (let k = 0; k < p.length; k += 2) {
    if (firstSeen[p[k]] < 0) firstSeen[p[k]] = i;
    lastSeen[p[k]] = i;
  }
}
// トリップ t が期間 [a,b] 内で最初/最後にレスした日(インデックス)。無ければ -1
function tripRangeSeen(t, a, b) {
  let first = -1, last = -1;
  for (let i = a; i <= b; i++) {
    const p = D.tripDays[i];
    for (let k = 0; k < p.length; k += 2) {
      if (p[k] === t) { if (first < 0) first = i; last = i; break; }
    }
  }
  return { first, last };
}
// 期間 [a,b] 内の、重複を除いたトリップ数・トリップごとの登場日数/投稿数
function tripStats(a, b) {
  const days = new Int32Array(nTrips), posts = new Int32Array(nTrips);
  let count = 0;
  for (let i = a; i <= b; i++) {
    const p = D.tripDays[i];
    for (let k = 0; k < p.length; k += 2) {
      if (days[p[k]]++ === 0) count++;
      posts[p[k]] += p[k + 1];
    }
  }
  return { count, days, posts };
}

/* ---------- 期間指定(プリセット + 開始/終了日)。上部の検索用と、選択中トリップを
   追いかける範囲用とで、同じ部品を独立に2つ使う ---------- */
const PRESETS = [['本日', 1], ['7日', 7], ['30日', 30], ['90日', 90]];
let RK = { a: N - 1, b: N - 1, q: '', chkOnly: false, sortKey: 'posts', limit: 20, sel: null };
let PD = { a: N - 1, b: N - 1 };

function rangeBar(ids, get, apply) {
  const box = $(ids.presets), from = $(ids.from), to = $(ids.to);
  const set = (a, b) => { if (a > b) [a, b] = [b, a]; apply(clamp(a, 0, N - 1), clamp(b, 0, N - 1)); };
  for (const [label, n] of PRESETS) {
    const btn = h('button', null, label, box);
    btn.type = 'button'; btn.dataset.n = n;
    btn.addEventListener('click', () => set(N - n, N - 1));
  }
  from.min = to.min = D.dates[0]; from.max = to.max = D.dates[N - 1];
  const custom = () => {
    const a = D.dates.indexOf(from.value), b = D.dates.indexOf(to.value);
    if (a >= 0 && b >= 0) set(a, b);
  };
  from.addEventListener('change', custom); to.addEventListener('change', custom);
  return function sync() {
    const { a, b } = get();
    from.value = D.dates[a]; to.value = D.dates[b];
    box.querySelectorAll('button').forEach(btn => {
      const n = +btn.dataset.n;
      btn.setAttribute('aria-pressed', String(b === N - 1 && b - a + 1 === Math.min(n, N)));
    });
  };
}
const syncRK = rangeBar({ presets: '#presets', from: '#from', to: '#to' }, () => RK, (a, b) => setRange(a, b));
function setRange(a, b) { RK.a = a; RK.b = b; RK.limit = 20; syncRK(); render(); }

const syncPD = rangeBar({ presets: '#pd-presets', from: '#pd-from', to: '#pd-to' }, () => PD, (a, b) => setPdRange(a, b));
function pdLabel(a, b) {
  const days = b - a + 1;
  return days === 1 ? `${fmtDate(D.dates[a])}(1日間)` : `${fmtDate(D.dates[a])} – ${fmtDate(D.dates[b])}（${days}日間）`;
}
function setPdRange(a, b) {
  PD.a = a; PD.b = b; RP.limit = 20; syncPD();
  $('#pd-period').textContent = pdLabel(a, b);
  if (RK.sel != null) renderTripPosts(D.tripNames[RK.sel]);
}

$('#daypick').min = D.dates[0]; $('#daypick').max = D.dates[N - 1];
$('#daypick').addEventListener('change', e => {
  const idx = D.dates.indexOf(e.target.value);
  if (idx >= 0) setRange(idx, idx);
});

// 前日/翌日: 選んでいる期間の幅を保ったまま、1日分ずらす(本日=1日幅なら1日ずつ移動)
function shiftDay(get, apply, delta) {
  const { a, b } = get(), width = b - a + 1;
  const newA = clamp(a + delta, 0, N - width);
  apply(newA, newA + width - 1);
}
$('#day-prev').addEventListener('click', () => shiftDay(() => RK, setRange, -1));
$('#day-next').addEventListener('click', () => shiftDay(() => RK, setRange, 1));
$('#pd-prev').addEventListener('click', () => shiftDay(() => PD, setPdRange, -1));
$('#pd-next').addEventListener('click', () => shiftDay(() => PD, setPdRange, 1));

/* ---------- KPI(期間内のユニークトリップ数・新規スレッド数) ---------- */
function renderKpis() {
  const st = tripStats(RK.a, RK.b);
  let threads = 0;
  for (let i = RK.a; i <= RK.b; i++) threads += D.threads[i];
  $('#k1-value').textContent = fmt0(st.count);
  $('#k2-value').textContent = fmt0(threads);
  const days = RK.b - RK.a + 1;
  $('#period').textContent = days === 1
    ? `${fmtDate(D.dates[RK.a])}(1日間)`
    : `${fmtDate(D.dates[RK.a])} – ${fmtDate(D.dates[RK.b])}（${days}日間）`;
}

/* ---------- トリップ一覧(期間内の投稿数順) ---------- */
function render() {
  renderKpis();
  const st = tripStats(RK.a, RK.b);
  let list = [];
  for (let t = 0; t < nTrips; t++) {
    if (!st.days[t]) continue;
    list.push({ t, name: D.tripNames[t], posts: st.posts[t], days: st.days[t], check: CHECKS[D.tripNames[t]] || 0 });
  }
  list.sort((p, q) => q.posts - p.posts || p.t - q.t);
  list.forEach((r, i) => { r.rank = i + 1; });
  const q = RK.q.trim().toLowerCase();
  let filtered = q ? list.filter(r => r.name.toLowerCase().includes(q)) : list;
  if (RK.chkOnly) { const done = myChecked(); filtered = filtered.filter(r => done.has(r.name)); }
  if (RK.sortKey !== 'posts') filtered = filtered.slice().sort((p, r) => r[RK.sortKey] - p[RK.sortKey] || r.posts - p.posts);
  $('#rank-count').textContent = `${fmt0(filtered.length)}件${q || RK.chkOnly ? '（絞り込み結果）' : ''}`;

  const thead = $('#rank-table thead'), tbody = $('#rank-table tbody');
  thead.textContent = ''; tbody.textContent = '';
  const tr = h('tr', null, null, thead);
  const RANK_COLS = [
    ['順位', null], ['トリップ', null], ['投稿数', 'posts'], ['登場日数', null],
    ['初登場', null], ['最終登場', null], ['チェック', 'check'],
  ];
  RANK_COLS.forEach(([label, sortKey], i) => {
    const th = h('th', i === 1 ? 'l' : '', null, tr);
    if (sortKey) {
      const btn = h('button', 'th-sort', label + (RK.sortKey === sortKey ? ' ▼' : ''), th);
      btn.type = 'button';
      btn.addEventListener('click', () => { RK.sortKey = sortKey; RK.limit = 20; render(); });
    } else th.textContent = label;
  });
  for (const r of filtered.slice(0, RK.limit)) {
    const already = myChecked().has(r.name);
    const rowCls = [RK.sel === r.t ? 'sel' : '', already ? 'chk-row' : ''].filter(Boolean).join(' ');
    const row = h('tr', rowCls, null, tbody);
    row.tabIndex = 0;
    [r.rank, r.name, fmt0(r.posts), fmt0(r.days), fmtDate(D.dates[firstSeen[r.t]]), fmtDate(D.dates[lastSeen[r.t]])]
      .forEach((v, i) => h('td', i === 1 ? 'l trip' : '', v, row));
    const chkTd = h('td', 'chk-cell', null, row);
    h('span', 'chk-count', fmt0(r.check), chkTd);
    const chkBtn = h('button', 'chk-btn' + (already ? ' done' : ''), already ? '✓済み' : 'チェック', chkTd);
    chkBtn.type = 'button';
    chkBtn.addEventListener('click', e => { e.stopPropagation(); toggleCheck(r.name, () => { render(); renderCheckRankings(); }); });
    const pick = () => selectTrip(r.t);
    row.addEventListener('click', pick);
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  }
  const more = $('#rank-more');
  more.hidden = filtered.length <= RK.limit;
  more.textContent = `さらに20件表示（残り ${fmt0(filtered.length - RK.limit)}件）`;

  renderDetail();
}

function selectTrip(t) {
  if (RK.sel !== t) {
    // 別のトリップに切り替えたら、対象範囲はいったん既定(本日)に戻し、
    // 前のトリップの共有URL表示も隠す
    PD = { a: N - 1, b: N - 1 };
    syncPD();
    $('#pd-period').textContent = pdLabel(PD.a, PD.b);
    $('#rd-share-row').hidden = true;
  }
  RK.sel = t;
  render();
}
function selectTripByName(name) {
  const t = D.tripNames.indexOf(name);
  if (t >= 0) selectTrip(t);
  return t >= 0;
}

/* ---------- チェック数ランキング(最終登場日が本日/7日以内/30日以内) ---------- */
function renderCheckRankings() {
  const last = N - 1; // データ上の最新日
  const buckets = [
    ['chk-rank-today', last],
    ['chk-rank-7d', last - 6],
    ['chk-rank-30d', last - 29],
  ];
  for (const [id, minIdx] of buckets) {
    const rows = [];
    for (let t = 0; t < nTrips; t++) {
      if (lastSeen[t] < 0 || lastSeen[t] < minIdx) continue;
      const c = CHECKS[D.tripNames[t]] || 0;
      if (c <= 0) continue;
      rows.push({ t, name: D.tripNames[t], check: c });
    }
    rows.sort((a, b) => b.check - a.check);
    const table = document.getElementById(id);
    const thead = table.querySelector('thead'), tbody = table.querySelector('tbody');
    thead.textContent = ''; tbody.textContent = '';
    const tr = h('tr', null, null, thead);
    ['順位', 'トリップ', 'チェック数'].forEach((label, i) => h('th', i === 1 ? 'l' : '', label, tr));
    if (!rows.length) {
      const row = h('tr', null, null, tbody);
      const td = h('td', 'chk-rank-empty', 'チェックされたトリップはまだありません', row);
      td.colSpan = 3;
      continue;
    }
    rows.slice(0, 10).forEach((r, i) => {
      const row = h('tr', null, null, tbody);
      row.tabIndex = 0;
      h('td', null, i + 1, row);
      h('td', 'l trip', r.name, row);
      h('td', null, fmt0(r.check), row);
      const pick = () => selectTrip(r.t);
      row.addEventListener('click', pick);
      row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });
  }
}

function renderDetail() {
  const det = $('#rank-detail');
  if (RK.sel == null) { det.hidden = true; return; }
  det.hidden = false;
  const t = RK.sel, st = tripStats(PD.a, PD.b);
  $('#rd-name').textContent = D.tripNames[t];
  const seen = tripRangeSeen(t, PD.a, PD.b);
  $('#rd-meta').textContent = seen.first >= 0
    ? `指定範囲のレス数 ${fmt0(st.posts[t])}件 / ${fmt0(st.days[t])}日  ・  期間内に初めてレスした日付 ${fmtDate(D.dates[seen.first])} ・ 期間内に最後にレスした日付 ${fmtDate(D.dates[seen.last])}`
    : `指定範囲のレス数 0件(この期間の書き込みはありません)`;
  renderTripPosts(D.tripNames[t]);
}

/* ---------- この人の投稿(直近の本文は trip_posts.json を選択時に遅延取得) ---------- */
const WD = ['月', '火', '水', '木', '金', '土', '日'];
const dowOf = s => (new Date(s + 'T00:00:00Z').getUTCDay() + 6) % 7;
const RP = { data: null, loading: false, trip: null, q: '', limit: 20 };
function ensureTripPosts() {
  if (RP.data || RP.loading) return RP.loading || Promise.resolve(RP.data);
  RP.loading = fetch('trip_posts.json', { cache: 'no-store' })
    .then(res => res.ok ? res.json() : {})
    .catch(() => ({}))
    .then(json => { RP.data = json.posts ? json : { posts: {}, titles: {} }; RP.loading = null; return RP.data; });
  return RP.loading;
}
function renderTripPosts(tripName) {
  if (RP.trip !== tripName) {
    RP.trip = tripName; RP.q = ''; RP.limit = 20;
    const q = $('#rd-posts-q'); if (q) q.value = '';
  }
  const listEl = $('#rd-posts-list'), countEl = $('#rd-posts-count'), moreBtn = $('#rd-posts-more');
  if (!RP.data) {
    listEl.textContent = ''; countEl.textContent = '読み込み中…'; moreBtn.hidden = true;
    ensureTripPosts().then(() => {
      if (RK.sel != null && D.tripNames[RK.sel] === tripName) renderTripPosts(tripName);
    });
    return;
  }
  const all = RP.data.posts[tripName] || [];
  // 「対象範囲」に、投稿一覧の表示もあわせる(上部のトリップ検索の期間とは独立)
  const lo = D.dates[PD.a], hi = D.dates[PD.b];
  const inRange = all.filter(p => p.date >= lo && p.date <= hi);
  const q = RP.q.trim();
  const filtered = q ? inRange.filter(p => (p.body || '').includes(q)) : inRange;
  countEl.textContent = inRange.length
    ? `${fmt0(filtered.length)}件${q ? `（絞り込み結果 / 期間内${fmt0(inRange.length)}件）` : ''}`
    : `この期間の投稿はありません(全期間では${fmt0(all.length)}件。保持期間外の可能性もあります)`;
  listEl.textContent = '';
  for (const p of filtered.slice(0, RP.limit)) {
    const item = h('div', 'rd-post', null, listEl);
    const info = RP.data.titles[p.thread_id] || {};
    const label = info.title || `(スレ${p.thread_id})`;
    if (info.url) {
      const link = h('a', 'rd-post-thread', label, item);
      link.href = info.url; link.target = '_blank'; link.rel = 'noopener noreferrer nofollow';
    } else {
      h('div', 'rd-post-thread', label, item);
    }
    const head = h('div', 'rd-post-head', null, item);
    h('span', null, `${p.no}：${p.name || ''}：${fmtDate(p.date)}(${WD[dowOf(p.date)]}) ${p.time || ''}`.trim(), head);
    h('div', 'rd-post-body', p.body || '', item);
  }
  moreBtn.hidden = filtered.length <= RP.limit;
  moreBtn.textContent = `さらに20件表示（残り ${fmt0(filtered.length - RP.limit)}件）`;
}

/* ---------- 起動時の配線 ---------- */
$('#rank-q').addEventListener('input', e => { RK.q = e.target.value; RK.limit = 20; render(); });
$('#rank-chk-only').addEventListener('change', e => { RK.chkOnly = e.target.checked; RK.limit = 20; render(); });
$('#rank-q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (v && selectTripByName(v)) e.preventDefault();
});
$('#rank-more').addEventListener('click', () => { RK.limit += 20; render(); });
$('#rd-close').addEventListener('click', () => { RK.sel = null; render(); });
$('#rd-posts-q').addEventListener('input', e => { RP.q = e.target.value; RP.limit = 20; if (RP.trip) renderTripPosts(RP.trip); });
$('#rd-posts-more').addEventListener('click', () => { RP.limit += 20; if (RP.trip) renderTripPosts(RP.trip); });

// 選択中のトリップを他の人と共有するためのURL(期間は付けない。開いた側は既定の「本日」から見る)
function buildShareUrl() {
  const url = new URL(location.href);
  url.search = '';
  url.searchParams.set('trip', D.tripNames[RK.sel]);
  return url.toString();
}
$('#rd-share').addEventListener('click', () => {
  if (RK.sel == null) return;
  const url = buildShareUrl();
  const input = $('#rd-share-url'), msg = $('#rd-share-msg');
  $('#rd-share-row').hidden = false;
  input.value = url;
  input.focus(); input.select();
  msg.textContent = '';
  const showCopied = () => { msg.textContent = 'コピーしました'; setTimeout(() => { msg.textContent = ''; }, 2500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(url).then(showCopied, () => { msg.textContent = '選択済みです。Ctrl+C でコピーしてください'; });
  } else {
    try {
      if (document.execCommand('copy')) showCopied();
      else msg.textContent = '選択済みです。Ctrl+C でコピーしてください';
    } catch (e) {
      msg.textContent = '選択済みです。Ctrl+C でコピーしてください';
    }
  }
});

const notes = $('#notes');
[
  'ユニークトリップ数は、指定した期間内に1回以上投稿したトリップの重複無しの数です(日別の値の合計ではありません)。',
  D.meta.partial ? `${fmtDate(D.meta.last)} は集計途中の可能性があります。` : null,
  `データ更新: ${fmtStamp(D.meta.updated || D.meta.generated)} / ページ生成: ${fmtStamp(D.meta.generated)}`
].filter(Boolean).forEach(t => h('li', null, t, notes));

const root = document.documentElement;
let saved = null;
try { saved = localStorage.getItem('theme'); } catch (e) {}
root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme').addEventListener('click', () => {
  const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
});

syncRK();
syncPD();
render();
renderCheckRankings();
loadChecks().then(() => { render(); renderCheckRankings(); });
const params = new URLSearchParams(location.search);
const initialTrip = params.get('trip');
if (initialTrip) selectTripByName(initialTrip);
})();
</script>
</body>
</html>
